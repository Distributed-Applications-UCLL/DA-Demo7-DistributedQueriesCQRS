spring.application.name=order-history-service
server.port=8088
spring.datasource.url=jdbc:h2:file:./OrderHistoryService/data/orderhistory;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=h2user7
spring.datasource.password=h2pass7

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#setup for service discovery, use spring.application.name now to discover in delivery service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

#setup rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false